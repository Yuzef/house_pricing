general:
  experiment_name: Baseline
  seed: 1027309
  task_type: regression
paths:
  train_csv: data_raw/train.csv
  test_csv: data_raw/test.csv
  trained_models: trained_models
  plots_dir: plots
target:
  name: SalePrice
  transform: log1p
metric:
  name: RMSLE
  sklearn_scoring: neg_root_mean_squared_log_error
id_column: Id
validation:
  strategy: stratified_kfold
  n_splits: 5
  n_bins: 10
  shuffle: true
  random_state: 1027309
  n_jobs: 6
  return_train_score: true
preprocessing:
  numerical_imputation:
    strategy: median
  categorical_imputation:
    strategy: most_frequent
  nominal_encoding:
    type: one_hot
    handle_unknown: ignore
  ordinal_encoding:
    enabled: false
  scaling:
    enabled: true
feature_engineering:
  age_features:
    enabled: true
  area_features:
    enabled: true
  bathroom_features:
    enabled: true
  quality_area_interaction:
    enabled: true
model:
  name: 6_lin_reg_BL_FE_all_True
  type: linear_regression
  params:
    fit_intercept: true
inference:
  enabled: true
  prediction_column: SalePrice
  submission_filename: submission.csv
