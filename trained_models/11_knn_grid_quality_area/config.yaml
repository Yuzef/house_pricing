general:
  experiment_name: Baseline
  seed: 1027309
  task_type: regression
paths:
  train_csv: data_raw/train.csv
  test_csv: data_raw/test.csv
  trained_models: trained_models
  plots_dir: plots
target:
  name: SalePrice
  transform: log1p
metric:
  name: RMSLE
  sklearn_scoring: neg_root_mean_squared_log_error
id_column: Id
validation:
  strategy: stratified_kfold
  n_splits: 5
  n_bins: 10
  shuffle: true
  random_state: 1027309
  n_jobs: 1
  return_train_score: true
preprocessing:
  numerical_imputation:
    strategy: median
  categorical_imputation:
    strategy: most_frequent
  nominal_encoding:
    type: one_hot
    handle_unknown: ignore
  ordinal_encoding:
    enabled: false
  scaling:
    enabled: true
feature_engineering:
  age_features:
    enabled: false
  area_features:
    enabled: false
  bathroom_features:
    enabled: false
  quality_area_interaction:
    enabled: true
model:
  name: 11_knn_grid_quality_area
  type: knn
  params:
    n_neighbors: 10
    weights: uniform
    metric: euclidean
    algorithm: brute
    n_jobs: 1
tuning:
  enabled: true
  inner_cv:
    n_splits: 5
    shuffle: true
    random_state: 1027309
  n_jobs: 5
  verbose: 1
  param_grid:
    model__regressor__n_neighbors:
    - 3
    - 5
    - 7
    - 11
    - 15
    - 21
    - 31
    model__regressor__weights:
    - uniform
    - distance
    model__regressor__metric:
    - euclidean
    - manhattan
inference:
  enabled: true
  prediction_column: SalePrice
  submission_filename: submission.csv
