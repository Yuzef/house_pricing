general:
  experiment_name: Boosting
  seed: 1027309
  task_type: regression
paths:
  train_csv: data_raw/train.csv
  test_csv: data_raw/test.csv
  trained_models: trained_models
  plots_dir: plots
target:
  name: SalePrice
  transform: log1p
metric:
  name: RMSLE
  sklearn_scoring: neg_root_mean_squared_log_error
id_column: Id
validation:
  strategy: stratified_kfold
  n_splits: 5
  n_bins: 10
  shuffle: true
  random_state: 1027309
  n_jobs: 1
  return_train_score: true
preprocessing:
  numerical_imputation:
    strategy: median
  categorical_imputation:
    strategy: most_frequent
  nominal_encoding:
    type: one_hot
    handle_unknown: ignore
  ordinal_encoding:
    enabled: false
  scaling:
    enabled: true
feature_engineering:
  age_features:
    enabled: false
  area_features:
    enabled: false
  bathroom_features:
    enabled: false
  quality_area_interaction:
    enabled: true
model:
  name: 18_xgboost_random_search_quality_area
  type: xgboost
  params:
    objective: reg:squarederror
    eval_metric: rmse
    booster: gbtree
    tree_method: hist
    n_estimators: 1000
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 1.0
    gamma: 0.0
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.0
    reg_lambda: 1.0
    random_state: 1027309
    n_jobs: 1
    verbosity: 0
tuning:
  enabled: true
  search_type: random
  n_iter: 30
  random_state: 1027309
  inner_cv:
    n_splits: 3
    shuffle: true
    random_state: 1027309
  n_jobs: 5
  verbose: 1
  param_space:
    model__regressor__n_estimators:
    - 300
    - 600
    - 1000
    - 1500
    model__regressor__learning_rate:
    - 0.01
    - 0.03
    - 0.05
    - 0.1
    model__regressor__max_depth:
    - 2
    - 3
    - 4
    - 6
    - 8
    model__regressor__min_child_weight:
    - 1.0
    - 3.0
    - 5.0
    - 10.0
    model__regressor__gamma:
    - 0.0
    - 0.01
    - 0.05
    - 0.1
    model__regressor__subsample:
    - 0.6
    - 0.8
    - 1.0
    model__regressor__colsample_bytree:
    - 0.5
    - 0.7
    - 0.9
    - 1.0
    model__regressor__reg_alpha:
    - 0.0
    - 0.001
    - 0.01
    - 0.1
    - 1.0
    model__regressor__reg_lambda:
    - 0.1
    - 1.0
    - 5.0
    - 10.0
    - 20.0
inference:
  enabled: true
  prediction_column: SalePrice
  submission_filename: submission.csv
