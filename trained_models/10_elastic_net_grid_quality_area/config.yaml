general:
  experiment_name: Baseline
  seed: 1027309
  task_type: regression
paths:
  train_csv: data_raw/train.csv
  test_csv: data_raw/test.csv
  trained_models: trained_models
  plots_dir: plots
target:
  name: SalePrice
  transform: log1p
metric:
  name: RMSLE
  sklearn_scoring: neg_root_mean_squared_log_error
id_column: Id
validation:
  strategy: stratified_kfold
  n_splits: 5
  n_bins: 10
  shuffle: true
  random_state: 1027309
  n_jobs: 1
  return_train_score: true
preprocessing:
  numerical_imputation:
    strategy: median
  categorical_imputation:
    strategy: most_frequent
  nominal_encoding:
    type: one_hot
    handle_unknown: ignore
  ordinal_encoding:
    enabled: false
  scaling:
    enabled: true
feature_engineering:
  age_features:
    enabled: false
  area_features:
    enabled: false
  bathroom_features:
    enabled: false
  quality_area_interaction:
    enabled: true
model:
  name: 10_elastic_net_grid_quality_area
  type: elastic_net
  params:
    alpha: 0.0005
    l1_ratio: 0.5
    fit_intercept: true
    max_iter: 20000
    tol: 0.0001
    selection: cyclic
tuning:
  enabled: true
  inner_cv:
    n_splits: 5
    shuffle: true
    random_state: 1027309
  n_jobs: 5
  verbose: 1
  param_grid:
    model__regressor__alpha:
    - 5.0e-05
    - 0.0001
    - 0.0005
    - 0.001
    - 0.005
    model__regressor__l1_ratio:
    - 0.2
    - 0.5
    - 0.8
inference:
  enabled: true
  prediction_column: SalePrice
  submission_filename: submission.csv
