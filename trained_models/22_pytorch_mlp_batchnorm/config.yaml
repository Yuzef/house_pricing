general:
  experiment_name: 22_pytorch_mlp_batchnorm
  seed: 1027309
  task_type: regression
paths:
  train_csv: data_raw/train.csv
  test_csv: data_raw/test.csv
  trained_models: trained_models
  plots_dir: plots
target:
  name: SalePrice
  transform: log1p
metric:
  name: RMSLE
  sklearn_scoring: neg_root_mean_squared_log_error
id_column: Id
validation:
  strategy: stratified_kfold
  n_splits: 5
  n_bins: 10
  shuffle: true
  random_state: 1027309
  n_jobs: 1
  return_train_score: true
preprocessing:
  numerical_imputation:
    strategy: median
  categorical_imputation:
    strategy: most_frequent
  nominal_encoding:
    type: one_hot
    handle_unknown: ignore
    sparse_output: false
  ordinal_encoding:
    enabled: false
  scaling:
    enabled: true
feature_engineering:
  age_features:
    enabled: false
  area_features:
    enabled: false
  bathroom_features:
    enabled: false
  quality_area_interaction:
    enabled: true
model:
  name: 22_pytorch_mlp_batchnorm
  type: DL
  params:
    batch_norm:
      enabled: false
tuning:
  enabled: false
  search_type: random
  n_iter: 30
  random_state: 1027309
  inner_cv:
    n_splits: 3
    shuffle: true
    random_state: 1027309
  n_jobs: 5
  verbose: 1
  param_space:
    model__regressor__n_estimators:
    - 300
    - 600
    - 1000
    - 1500
    model__regressor__learning_rate:
    - 0.01
    - 0.03
    - 0.05
    - 0.1
    model__regressor__max_depth:
    - 2
    - 3
    - 4
    - 6
    - 8
    model__regressor__min_child_weight:
    - 1.0
    - 3.0
    - 5.0
    - 10.0
    model__regressor__gamma:
    - 0.0
    - 0.01
    - 0.05
    - 0.1
    model__regressor__subsample:
    - 0.6
    - 0.8
    - 1.0
    model__regressor__colsample_bytree:
    - 0.5
    - 0.7
    - 0.9
    - 1.0
    model__regressor__reg_alpha:
    - 0.0
    - 0.001
    - 0.01
    - 0.1
    - 1.0
    model__regressor__reg_lambda:
    - 0.1
    - 1.0
    - 5.0
    - 10.0
    - 20.0
dl:
  training:
    max_epochs: 100
    device: cpu
    num_workers: 0
    pin_memory: false
    drop_last: false
    gradient_clip_norm: 1.0
    mixed_precision: false
optuna:
  study_name: 22_pytorch_mlp_batchnorm
  target_n_trials: 12
  timeout_seconds: null
  n_jobs: 1
  inner_validation:
    strategy: stratified_kfold
    n_splits: 3
    n_bins: 10
    shuffle: true
    random_state: 1027309
  sampler:
    name: tpe
    seed: 1027309
    n_startup_trials: 5
  pruner:
    name: median
    n_startup_trials: 5
    n_warmup_steps: 1
  search_space:
    hidden_dim:
    - 16
    - 32
    - 64
    hidden_dim_2:
    - 16
    - 32
    activation:
    - relu
    - gelu
    - silu
    batch_size:
    - 16
    - 32
    learning_rate:
      low: 0.0002
      high: 0.001
      log: true
    weight_decay:
      low: 1.0e-07
      high: 0.003
      log: true
    dropout:
    - 0.0
    - 0.1
    - 0.2
    - 0.3
inference:
  enabled: true
  prediction_column: SalePrice
  submission_filename: submission.csv
visualization:
  enabled: true
  save_fold_scores: true
  save_optuna_history: true
  save_dropout_effect: true
  show_plots: false
  figure_dpi: 150
  style: seaborn-v0_8-whitegrid
  format: png
